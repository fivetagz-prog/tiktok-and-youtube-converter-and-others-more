<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Media Converter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Universal Converter</h1>
        <p class="subtitle">Download MP3, WAV, M4A, or MP4 from YouTube, TikTok, Instagram, Twitter/X, SoundCloud & Twitch</p>
        
        <form id="converterForm">
            <div class="form-group">
                <label for="url">Media Link</label>
                <input type="url" id="url" placeholder="Paste link here..." required>
            </div>
            
            <div class="form-group">
                <label for="format">Output Format</label>
                <select id="format">
                    <option value="mp3">Audio (MP3)</option>
                    <option value="wav">Audio (WAV)</option>
                    <option value="m4a">Audio (M4A)</option>
                    <option value="mp4">Video (MP4)</option>
                </select>
            </div>
            
            <button type="submit" id="submitBtn">Convert & Download</button>
        </form>
        
        <div id="status"></div>
    </div>

    <script src="convert.js"></script>
</body>
</html>
