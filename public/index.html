<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube & TikTok MP4 Downloader</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>YouTube & TikTok MP4 Downloader</h1>
        <p class="subtitle">Download videos directly in MP4 format</p>
        <form id="converterForm">
            <div class="form-group">
                <label for="url">Video Link</label>
                <input type="url" id="url" placeholder="https://www.youtube.com/... or https://www.tiktok.com/..." required>
            </div>
            <button type="submit" id="submitBtn">Download MP4 Video</button>
        </form>
        <div id="status"></div>
    </div>

    <script src="convert.js"></script>
</body>
</html>
